<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ключи">
<meta name="theme-color" content="#0d1020">
<title>Ключи</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
:root{
  --bg1:#1b1f3b; --bg2:#0a0c18;
  --glass2:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.16); --txt:#f2f3f8; --mut:#a7abc3;
  --gold:#ffcf73;
  --sat:max(env(safe-area-inset-top), 26px); --sab:env(safe-area-inset-bottom);
  --sal:0px; --sar:0px;
  --pill:86px; /* справа в шапке место под «островок» со временем и зарядом (iPhone Duo) */
  --below:10px; /* отступ разделов от шапки */
}
/* iPhone Duo: разделы начинаются ниже «островка» со временем и зарядом */
@media (max-width:600px) and (orientation:portrait){ :root{ --below:84px; } }
@media (min-width:601px) and (min-height:501px){ :root{ --below:30px; } }
/* боковые отступы под вырез камеры — только внешний экран в горизонтальном положении */
@media (orientation:landscape) and (max-height:500px){ :root{ --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right); } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea,select{font-size:16px!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#0a0c18}
html,body{margin:0;padding:0;width:100%;max-width:none;min-height:100%;overflow-x:hidden}
.top,main{width:100%}
body{
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  color:var(--txt);min-height:100vh;min-height:100dvh;background:transparent;
}
body::before{content:"";position:fixed;inset:-2px;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60vmax 60vmax at 0% 0%, rgba(245,185,66,.28), transparent 60%),
    radial-gradient(60vmax 60vmax at 100% 100%, rgba(91,124,255,.32), transparent 60%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
}
.top{
  position:sticky;top:0;z-index:20;
  padding:calc(var(--sat) + 6px) calc(var(--sar) + var(--pill)) 6px calc(var(--sal) + 10px);
  display:flex;align-items:center;gap:10px;min-height:44px;
  background:rgba(13,16,32,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.brand{font-weight:700;font-size:16px;flex:1;display:flex;align-items:center;gap:6px}
.brand span{color:var(--gold)}
.gh{font-size:13px;color:var(--mut);white-space:nowrap}
.gh.ok{color:#9fe8bd}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--glass2);color:var(--txt);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#ptr{position:fixed;left:50%;top:calc(var(--sat) + 52px);transform:translate(-50%,-60px);z-index:15;
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--glass2);border:1px solid var(--line);font-size:17px;color:var(--gold);opacity:0}
main{padding:var(--below) calc(var(--sar) + 10px) calc(var(--sab) + 16px) calc(var(--sal) + 10px);
  display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:700px){ main{grid-template-columns:1fr 1fr;align-items:start} .span2{grid-column:1/-1} }
.qn{display:inline-block;min-width:22px;padding:1px 8px;border-radius:10px;background:rgba(255,182,72,.2);color:#ffe3b8;font-size:14px;text-align:center}.qi{border-top:1px solid var(--line);padding:10px 0}.qi:first-child{border-top:0}.qh{display:flex;justify-content:space-between;font-weight:600}.qs{font-size:13px;color:var(--mut);margin:2px 0 8px;word-break:break-all}.qb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05));
  border:1px solid var(--line);border-radius:18px;padding:13px;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:0 8px 24px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.12);
  min-width:0;display:grid;gap:9px;
}
.card h2{margin:0;font-size:15px;font-weight:700}
.mut{color:var(--mut);font-size:13px}
input[type=text],input[type=password],input[type=tel]{
  width:100%;background:rgba(0,0,0,.25);color:var(--txt);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;outline:none;
  font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px;
}
input:focus{border-color:rgba(255,207,115,.6)}
input::placeholder{color:rgba(167,171,195,.6)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  border:1px solid var(--line);background:var(--glass2);color:var(--txt);
  font:600 15px/1 inherit;font-family:inherit;padding:13px 14px;border-radius:13px;cursor:pointer;min-height:46px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55}
.btn.gold{background:linear-gradient(180deg,#ffe2a3,#f0b042);color:#2a1a00;border-color:rgba(255,255,255,.4)}
.btn.red{background:linear-gradient(180deg,#ff8f8f,#e04848);color:#2b0505;border-color:rgba(255,255,255,.35)}
.btn.sm{font-size:14px;min-height:38px;padding:9px 12px;border-radius:11px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat div{font-size:24px;font-weight:700}
.stat small{color:var(--mut);font-size:13px}
.stat.g div{color:#9fe8bd} .stat.r div{color:#ff9d9d}
.msg{border-radius:12px;padding:9px 11px;font-size:14px;font-weight:600;border:1px solid;display:none}
.msg.on{display:block}
.m-ok{background:rgba(95,214,142,.13);border-color:rgba(95,214,142,.45);color:#c9f5d9}
.m-bad{background:rgba(255,107,107,.13);border-color:rgba(255,107,107,.45);color:#ffd1d1}
.m-warn{background:rgba(255,182,72,.13);border-color:rgba(255,182,72,.45);color:#ffe3b8}
.m-info{background:rgba(255,255,255,.07);border-color:var(--line);color:var(--mut)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,6,14,.55);display:none;align-items:center;justify-content:center;padding:20px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ov.on{display:flex}
/* зелёная плитка «Активировать ключ» и всплывающее окно с пружинкой */
.btn.green{background:linear-gradient(180deg,#7dffb0,#22c26b);color:#03250f;border-color:rgba(255,255,255,.45);min-height:58px;font-size:17px;font-weight:700;border-radius:18px;box-shadow:0 8px 24px rgba(34,194,107,.35)}
#actOv{z-index:40}
.actPop{width:min(360px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,rgba(40,44,74,.97),rgba(22,25,46,.98))!important;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#actOv.on .actPop{animation:actIn .55s cubic-bezier(.34,1.56,.64,1) both}
@keyframes actIn{0%{transform:scale(.6);opacity:0}60%{opacity:1}100%{transform:scale(1)}}
.jelly{animation:kJelly .9s ease-out both}
@keyframes kJelly{0%{transform:scale(1,1)}14%{transform:scale(1.12,.84)}30%{transform:scale(.9,1.1)}46%{transform:scale(1.06,.95)}62%{transform:scale(.97,1.03)}78%{transform:scale(1.01,.99)}100%{transform:scale(1,1)}}

.pop{width:min(340px,100%);max-height:85vh;overflow:auto;border-radius:18px;padding:14px;display:grid;gap:9px;
  background:linear-gradient(180deg,rgba(40,44,74,.95),rgba(22,25,46,.96));border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.pop h3{margin:0;font-size:15px}
.pop ol{margin:0;padding-left:18px;font-size:13px;color:var(--mut);display:grid;gap:3px}
.pop a{color:var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 20px);transform:translateX(-50%);z-index:60;
  background:rgba(20,24,44,.94);border:1px solid var(--line);padding:9px 14px;border-radius:12px;font-size:14px;
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="top">
  <div class="brand">🔑 <span>Ключи</span></div>
  <div class="gh" id="ghState">GitHub не подключён</div>
  <button class="icon-btn" id="bSet" aria-label="Настройки">⚙︎</button>
</div>
<div id="ptr">↻</div>

<main>
  <div class="card span2 statsCard">
    <div class="stats">
      <div class="stat g"><div id="sAct">—</div><small>активировано</small></div>
      <div class="stat r"><div id="sBlk">—</div><small>заблокировано</small></div>
    </div>
  </div>

  <div class="card span2" id="qCard">
    <h2>🌙 Ждут проверки <span id="qN" class="qn"></span></h2>
    <div id="qList"><div class="mut">Загружаю…</div></div>
  </div>

  <div class="ov" id="actOv"><div class="card actPop" id="actCard">
    <h2>Активировать ключ</h2>
    <input type="tel" id="pAct" placeholder="Номер телефона: +7 999 123-45-67" autocomplete="off">
    <input type="text" id="kAct" placeholder="UG-XXXX-XXXX-XXXX" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="stats" id="term" style="grid-template-columns:1fr 1fr 1fr"><button class="btn sm" data-t="m">Месяц · 390 ₽</button><button class="btn sm gold" data-t="h">Полгода · 1 990 ₽</button><button class="btn sm" data-t="y">Год · 2 990 ₽</button></div>
    <button class="btn gold" id="bAct">✓ Активировать</button>
    <div class="msg" id="mAct"></div>
    <button class="btn sm" id="actX">Закрыть</button>
  </div></div>

  <div class="card" style="display:none">
    <h2>Заблокировать ключ</h2>
    <input type="text" id="kBlk" placeholder="Ключ или номер телефона" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="btn red" id="bBlk">⛔ Заблокировать</button>
    <div class="msg" id="mBlk"></div>
  </div>
  <button class="btn green span2" id="actTile">🔑 Активировать ключ</button>
</main>

<div class="ov" id="ov"><div class="pop" id="pop"></div></div>
<div id="toast"></div>

<script>
const APP_VER = '25';
const OWNER = 'chamsutdinov-bot', REPO = 'klyuchi';
const LS = 'klyuchi.v3';
const ALPH = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
const APPS = { UG: 'Universal Gym · Men', UW: 'Universal Gym · Woman', UP: 'Universal Gym · Питание', KM: 'Конструктор' };
const YEAR = 183*24*60*60*1000; /* срок подписки: полгода */
const TERMS = { m:{ ms:30*24*60*60*1000, t:'месяц' }, h:{ ms:YEAR, t:'полгода' }, y:{ ms:365*24*60*60*1000, t:'год' }, f:{ ms:100*365*24*60*60*1000, t:'навсегда' } };
/* «Питание» (UP) покупается навсегда — срок выбирается сам, кнопки сроков к нему не относятся */
const termFor = app => app==='UP' ? 'f' : (term==='f' ? 'h' : term);
let term = 'h'; /* выбранный срок при активации */
/* покупатели хранятся по номеру; у Universal Gym — просто номер, у других приложений — «KM:номер» */
const bk = (num, app) => app==='UG' ? num : app+':'+num;
const showNum = n => '+'+String(n).replace(/^[A-Z]+:/,'');
const fmtD = t => new Date(t).toLocaleDateString('ru-RU');
const $ = s => document.querySelector(s);
let cfg = {};
try{ cfg = JSON.parse(localStorage.getItem(LS)||'{}'); }catch(e){ cfg = {}; }
const saveCfg = () => { try{ localStorage.setItem(LS, JSON.stringify(cfg)); }catch(e){} };

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),1800); }
function msg(id, cls, text){ const m=$(id); m.className='msg on '+cls; m.innerHTML=text; }
function popup(html){ $('#pop').innerHTML=html; $('#ov').classList.add('on'); }
function closePop(){ $('#ov').classList.remove('on'); }
$('#ov').addEventListener('click', e=>{ if(e.target.id==='ov') closePop(); });

/* ---------- key format: UG-XXXX-XXXX-XXXX (11 random + 1 check) ---------- */
function checkChar(body){ let s=0; for(let i=0;i<body.length;i++) s += ALPH.indexOf(body[i])*(i+1); return ALPH[s%32]; }
function parseKey(raw){
  const up = (raw||'').toUpperCase();
  const m = up.match(/([A-Z]{2})\s*-?\s*([0-9A-Z]{4})\s*-?\s*([0-9A-Z]{4})\s*-?\s*([0-9A-Z]{4})/);
  if (!m) return {err:'Ключ должен выглядеть так: UG-XXXX-XXXX-XXXX'};
  const app = m[1], body = m[2]+m[3]+m[4];
  if (!APPS[app]) return {err:'Неизвестное приложение: '+app};
  for (const c of body) if (ALPH.indexOf(c)<0) return {err:'В ключе есть недопустимый символ: '+c};
  if (checkChar(body.slice(0,11)) !== body[11]) return {err:'Ключ введён с ошибкой. Проверь каждый символ'};
  return { app, body, key: app+'-'+m[2]+'-'+m[3]+'-'+m[4] };
}
async function keyHash(k){
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('UGK|'+k.app+'|'+k.body)));
  return Array.from(h, b=>b.toString(16).padStart(2,'0')).join('');
}
/* номер телефона: только цифры, 8XXXXXXXXXX и 10 цифр → 7XXXXXXXXXX */
function parsePhone(raw){
  let t = (raw||'').toUpperCase();
  const km = t.match(/[A-Z]{2}\s*-?\s*[0-9A-Z]{4}\s*-?\s*[0-9A-Z]{4}\s*-?\s*[0-9A-Z]{4}/); if (km) t = t.replace(km[0],' ');
  const m = t.match(/\+?\d[\d\s\-()]{6,20}\d/); if (!m) return {err:'Введи номер телефона покупателя'};
  let d = m[0].replace(/\D/g,'');
  if (d.length===11 && d[0]==='8') d = '7'+d.slice(1);
  if (d.length===10 && d[0]==='9') d = '7'+d;
  if (d.length<10 || d.length>15) return {err:'Номер телефона введён не полностью'};
  return { num:d, show:'+'+d };
}
function fill(src){
  const t = src.value, k = parseKey(t), p = parsePhone(t);
  if (k.key && p.num){ $('#pAct').value = p.show; $('#kAct').value = k.key; }
  const pm = t.match(/📅\s*(12|6|1)\b/); if (pm) setTerm(pm[1]==='12' ? 'y' : pm[1]==='1' ? 'm' : 'h');
  else if (src.id==='kAct' && k.key && t!==k.key) src.value = k.key;
}
['#kAct','#pAct'].forEach(s=>$(s).addEventListener('input', e=>fill(e.target)));
$('#kBlk').addEventListener('input', ()=>{ const k=parseKey($('#kBlk').value); if(k.key && $('#kBlk').value!==k.key && !parsePhone($('#kBlk').value.replace(k.key,'')).num) $('#kBlk').value=k.key; });

/* ---------- GitHub storage ---------- */
const DATA = 'klyuchi-data';
let lastGh = '';
const api = (p, repo=REPO) => `https://api.github.com/repos/${OWNER}/${repo}/contents/${p}`;
const b64e = s => btoa(unescape(encodeURIComponent(s)));
const b64d = s => decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function ghGet(path, repo){
  const r = await fetch(api(path,repo)+'?t='+Date.now(), { headers:{ Authorization:'Bearer '+cfg.token, Accept:'application/vnd.github+json' }, cache:'no-store' });
  if (r.status===404){ if (repo===DATA){ const c = await fetch(`https://api.github.com/repos/${OWNER}/${DATA}`, { headers:{ Authorization:'Bearer '+cfg.token }, cache:'no-store' }); if (!c.ok) throw new Error('nodata'); } return { data:null, sha:null }; }
  if (r.status===401 || r.status===403) throw new Error(repo===DATA?'nodata':'auth');
  if (!r.ok) throw new Error('net');
  const j = await r.json();
  return { data: JSON.parse(b64d(j.content)), sha: j.sha };
}
async function ghPut(path, data, sha, repo){
  const r = await fetch(api(path,repo), { method:'PUT', headers:{ Authorization:'Bearer '+cfg.token, Accept:'application/vnd.github+json' },
    body: JSON.stringify({ message:'Обновление списка', content:b64e(JSON.stringify(data)), ...(sha?{sha}:{}) }) });
  if (r.status===409 || r.status===422) throw new Error('conflict');
  if (r.status===401) throw new Error('auth');
  if (r.status===403 || r.status===404){ let t=''; try{ t=(await r.json()).message||''; }catch(e){} lastGh = r.status+' '+t; throw new Error(repo===DATA?'nodata':'nowrite'); }
  if (!r.ok) throw new Error('net');
  return (await r.json()).content.sha;
}
async function shard(k){
  const h = await keyHash(k), path = `list/${k.app}/${h.slice(0,2)}.json`, id = h.slice(2,18);
  const s = await ghGet(path);
  const d = s.data || {};
  if (Array.isArray(d.a)){ const o={}; d.a.forEach(x=>o[x]=Date.now()+YEAR); d.a=o; }
  d.a = d.a || {}; d.b = d.b || []; d.m = d.m || [];
  return { path, id, d, sha:s.sha };
}
/* номер телефона → срок: по номеру приложение открывается на любом телефоне и в любой копии (Safari или иконка) */
async function setPhone(app, num, u){
  num = String(num).replace(/^[A-Z]+:/,'');
  const h = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('UGP|'+app+'|'+num))), b=>b.toString(16).padStart(2,'0')).join('');
  const path = `list/${app}/p/${h.slice(0,2)}.json`, id = h.slice(2,18);
  const s = await ghGet(path); const d = s.data || {};
  if (u) d[id] = u; else delete d[id];
  await ghPut(path, d, s.sha);
}
async function saveShard(s){ s.sha = await ghPut(s.path, s.d, s.sha); }
async function bumpStats(app, da, db){
  if (!da && !db) return;
  const st = await ghGet('list/stats.json'); const sd = st.data || {};
  sd[app] = sd[app] || { a:0, b:0 }; sd[app].a += da||0; sd[app].b += db||0;
  await ghPut('list/stats.json', sd, st.sha);
}
async function buyers(){ const s = await ghGet('buyers.json', DATA); return { d: s.data || {}, sha: s.sha }; }
async function saveBuyers(b){ b.sha = await ghPut('buyers.json', b.d, b.sha, DATA); }
function keyOwner(B, key){ for (const n in B.d) if (B.d[n].k===key) return n; return null; }

function errText(e){
  if (e.message==='auth') return 'GitHub не принял пропуск. Проверь его в настройках ⚙︎';
  if (e.message==='nowrite') return 'Пропуск не может записывать в репозиторий Klyuchi. В настройках пропуска на GitHub отметь Klyuchi и поставь Contents: Read and write' + (lastGh?` <span style="opacity:.7;font-weight:400">(GitHub: ${lastGh})</span>`:'');
  if (e.message==='nodata') return 'Нет доступа к закрытому репозиторию klyuchi-data. Создай его и добавь в пропуск';
  if (e.message==='conflict') return 'Данные изменились во время записи. Нажми ещё раз';
  return 'Нет связи с GitHub. Проверь интернет и попробуй ещё раз';
}

async function loadStats(){
  if (!cfg.token) return;
  try{
    const st = await ghGet('list/stats.json');
    let a=0,b=0; for (const v of Object.values(st.data||{})){ a+=v.a; b+=v.b; }
    $('#sAct').textContent=a.toLocaleString('ru-RU'); $('#sBlk').textContent=b.toLocaleString('ru-RU');
    ghOk(true);
  }catch(e){ ghOk(false, e.message==='auth'); }
}
function ghOk(ok, auth){
  const el=$('#ghState');
  if (!cfg.token){ el.textContent='GitHub не подключён'; el.className='gh'; return; }
  el.textContent = ok ? '● GitHub' : (auth ? 'Пропуск не подходит' : 'Нет связи');
  el.className = 'gh' + (ok?' ok':'');
}

function needToken(){ if (cfg.token) return false; openSettings(); return true; }
function ask(title, text, okText, okCls, fn){
  popup(`<h3>${title}</h3><div class="mut">${text}</div>
    <div class="stats"><button class="btn sm" onclick="closePop()">Отмена</button><button class="btn ${okCls} sm" id="bAsk">${okText}</button></div>`);
  $('#bAsk').onclick = ()=>{ closePop(); fn(); };
}

/* mode: undefined — проверить и спросить; 'extend' — продлить на полгода; 'move' — перенести на новый ключ */
async function doActivate(p, k, mode){
  const btn=$('#bAct'); btn.disabled=true; msg('#mAct','m-info','Записываю…');
  try{
    const B = await buyers(), now = Date.now(), key = bk(p.num, k.app), T = TERMS[termFor(k.app)];
    const rec = B.d[key];
    const S = await shard(k);
    if (S.d.b.includes(S.id)) { msg('#mAct','m-bad','⛔ Этот ключ заблокирован'); return; }
    const owner = keyOwner(B, k.key);
    if (owner && owner!==key){ msg('#mAct','m-bad',`✗ Этот ключ уже привязан к номеру ${showNum(owner)}`); return; }

    if (!rec){                                         /* новая покупка */
      const u = now + T.ms;
      S.d.a[S.id] = u; S.d.m = S.d.m.filter(x=>x!==S.id); await saveShard(S);
      B.d[key] = { k:k.key, u, t:now }; await saveBuyers(B); await setPhone(k.app, p.num, u);
      await bumpStats(k.app, 1, 0);
      done(`✓ ${p.show} — ${k.key} активирован ${k.app==='UP'?'навсегда':'до '+fmtD(u)}`);
    }
    else if (rec.k===k.key){                           /* тот же телефон */
      if (rec.u > now && mode!=='extend'){
        try{ await setPhone(k.app, p.num, rec.u); }catch(e){}
        msg('#mAct','m-warn',`Подписка ${p.show} уже активна до ${fmtD(rec.u)}`);
        ask('Подписка уже активна', `${p.show} действует до ${fmtD(rec.u)}. Продлить ещё на ${T.t}, до ${fmtD(rec.u+T.ms)}?`, 'Продлить', 'gold', ()=>doActivate(p,k,'extend'));
        return;
      }
      const u = Math.max(now, rec.u) + T.ms;
      S.d.a[S.id] = u; await saveShard(S);
      rec.u = u; await saveBuyers(B); await setPhone(k.app, p.num, u);
      done(`✓ ${p.show} — продлено до ${fmtD(u)}`);
    }
    else {                                             /* новый телефон: перенос */
      const live = rec.u > now;
      if (mode!=='move'){
        msg('#mAct','m-warn',`Номер ${p.show} уже привязан к ключу ${rec.k}`);
        ask('Восстановить покупку?', live
          ? `${p.show} сейчас привязан к ключу ${rec.k}, подписка до ${fmtD(rec.u)}. Перенести её на новый ключ ${k.key}? Старый телефон отключится.`
          : `Подписка ${p.show} закончилась ${fmtD(rec.u)}. Перенести на новый ключ ${k.key} и продлить на ${T.t}?`,
          live ? 'Перенести' : 'Перенести и продлить', 'gold', ()=>doActivate(p,k,'move'));
        return;
      }
      const u = live ? rec.u : now + T.ms;
      const old = parseKey(rec.k);
      if (old.key){
        const O = await shard(old);
        if (O.path===S.path){ delete S.d.a[O.id]; if(!S.d.m.includes(O.id)) S.d.m.push(O.id); }
        else { delete O.d.a[O.id]; if(!O.d.m.includes(O.id)) O.d.m.push(O.id); await saveShard(O); }
      }
      S.d.a[S.id] = u; S.d.m = S.d.m.filter(x=>x!==S.id); await saveShard(S);
      (rec.old = rec.old || []).push(rec.k); rec.k = k.key; rec.u = u; await saveBuyers(B); await setPhone(k.app, p.num, u);
      done(`✓ ${p.show} — покупка перенесена на ${k.key}, до ${fmtD(u)}. Старый ключ отключён`);
    }
  }catch(e){ msg('#mAct','m-bad','✗ '+errText(e)); }
  finally{ btn.disabled=false; }
  function done(t){ msg('#mAct','m-ok', t+'. У покупателя приложение откроется примерно через 30 секунд'); $('#kAct').value=''; $('#pAct').value=''; loadStats(); }
}
function setTerm(t){ term = t; document.querySelectorAll('#term button').forEach(x=>x.classList.toggle('gold', x.dataset.t===t)); }
$('#term').onclick = e=>{ const b = e.target.closest('button'); if (!b) return; setTerm(b.dataset.t); };

/* плитка «Активировать ключ»: окно открывается с пружинкой */
function openAct(){ $('#actOv').classList.add('on'); }
function closeAct(){ $('#actOv').classList.remove('on'); }
$('#actTile').onclick = ()=>{ const t=$('#actTile'); t.classList.remove('jelly'); void t.offsetWidth; t.classList.add('jelly'); setTimeout(openAct,180); };
$('#actTile').addEventListener('animationend', e=>{ if(e.animationName==='kJelly') e.target.classList.remove('jelly'); });
$('#actX').onclick = closeAct;
$('#actOv').addEventListener('click', e=>{ if(e.target.id==='actOv') closeAct(); });
$('#bAct').onclick = ()=>{
  const p = parsePhone($('#pAct').value);
  if (p.err) return msg('#mAct','m-bad','✗ '+p.err);
  const k = parseKey($('#kAct').value);
  if (k.err) return msg('#mAct','m-bad','✗ '+k.err);
  if (needToken()) return;
  doActivate(p, k);
};

$('#bBlk').onclick = async ()=>{
  const raw = $('#kBlk').value;
  let k = parseKey(raw);
  if (needToken()) return;
  let num = null;
  if (k.err){
    const p = parsePhone(raw);
    if (p.err) return msg('#mBlk','m-bad','✗ Введи ключ или номер телефона');
    try{
      const B = await buyers(), keys = Object.keys(B.d).filter(n => n===p.num || n.endsWith(':'+p.num));
      if (!keys.length) return msg('#mBlk','m-bad','✗ Покупатель с таким номером не найден');
      if (keys.length>1) return msg('#mBlk','m-bad','✗ У этого номера несколько приложений — введи ключ');
      k = parseKey(B.d[keys[0]].k); num = keys[0];
    }
    catch(e){ return msg('#mBlk','m-bad','✗ '+errText(e)); }
  }
  ask(`Заблокировать ${k.key}?`, (num?`Номер ${showNum(num)}. `:'')+'Приложение на этом телефоне закроется при следующей проверке, когда будет интернет.', 'Заблокировать', 'red', async ()=>{
    const b=$('#bBlk'); b.disabled=true; msg('#mBlk','m-info','Записываю…');
    try{
      const S = await shard(k);
      if (S.d.b.includes(S.id)) { msg('#mBlk','m-warn','Этот ключ уже заблокирован'); return; }
      const wasAct = !!S.d.a[S.id];
      delete S.d.a[S.id]; S.d.b.push(S.id); await saveShard(S);
      try{ const B = await buyers(); const n = num || keyOwner(B, k.key); if (n){ B.d[n].blk = Date.now(); await saveBuyers(B); await setPhone(k.app, n, 0); } }catch(e){}
      await bumpStats(k.app, wasAct?-1:0, 1);
      msg('#mBlk','m-ok',`⛔ ${k.key} заблокирован`); $('#kBlk').value=''; loadStats();
    }catch(e){ msg('#mBlk','m-bad','✗ '+errText(e)); }
    finally{ b.disabled=false; }
  });
};

/* ---------- settings: GitHub token ---------- */
function openSettings(){
  popup(`<h3>Подключить GitHub</h3>
    <div class="mut">Пропуск нужен, чтобы админка записывала ключи в репозиторий Klyuchi. Он хранится только на этом телефоне.</div>
    <ol>
      <li>Открой <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">создание пропуска на GitHub</a></li>
      <li>Token name: <b>Klyuchi</b>, Expiration: <b>No expiration</b></li>
      <li>Repository access: <b>Only select repositories</b> → <b>klyuchi</b> и <b>klyuchi-data</b></li>
      <li>Permissions → Contents: <b>Read and write</b></li>
      <li>Generate token → скопируй и вставь сюда</li>
    </ol>
    <input type="password" id="tok" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false" value="${cfg.token?cfg.token.replace(/"/g,''):''}">
    <button class="btn gold sm" id="bTok">Сохранить</button>
    <div class="msg" id="mTok"></div>
    <h3 style="margin-top:6px">Заявки в Telegram</h3>
    <div class="mut">${cfg.tg?`Подключён бот <b>@${cfg.tg}</b>. Номер, ключ, срок и чек от покупателя приходят тебе от него.`:'Покупатель нажмёт «Отправить» в приложении, и номер, ключ, срок и чек об оплате придут тебе от твоего бота.'}</div>
    <ol>
      <li>Открой <a href="https://t.me/BotFather" target="_blank" rel="noopener">@BotFather</a> → <b>/newbot</b> → придумай имя и username (в конце <b>bot</b>)</li>
      <li>Скопируй токен, который пришлёт BotFather, и вставь сюда</li>
      <li>Открой своего бота и нажми <b>Старт</b> (или напиши ему что угодно)</li>
      <li>Нажми «Подключить бота»</li>
    </ol>
    <input type="password" id="tgTok" placeholder="123456789:AA…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn gold sm" id="bTg">Подключить бота</button>
    <div class="msg" id="mTg"></div>`);
  $('#bTg').onclick = async ()=>{
    const t = $('#tgTok').value.trim().replace(/^bot/,'');
    if (!/^\d+:[\w-]{20,}$/.test(t)) return msg('#mTg','m-bad','Вставь токен от BotFather');
    if (needToken()) return;
    msg('#mTg','m-info','Проверяю…');
    const tg = m => fetch(`https://api.telegram.org/bot${t}/${m}`, {cache:'no-store'}).then(r=>r.json());
    try{
      const me = await tg('getMe');
      if (!me.ok) return msg('#mTg','m-bad','Telegram не принял токен. Скопируй его из BotFather ещё раз');
      const up = await tg('getUpdates');
      const ch = (up.result||[]).map(u=>(u.message||u.my_chat_member||{}).chat).filter(c=>c&&c.type==='private').pop();
      if (!ch) return msg('#mTg','m-bad',`Открой <a href="https://t.me/${me.result.username}" target="_blank" rel="noopener">@${me.result.username}</a>, нажми «Старт» и снова «Подключить бота»`);
      const cur = await ghGet('list/tg.json');
      await ghPut('list/tg.json', { t, c: ch.id }, cur.sha);
      await fetch(`https://api.telegram.org/bot${t}/sendMessage`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ chat_id: ch.id, text:'✅ Бот подключён к админке «Ключи». Сюда будут приходить заявки покупателей.' }) });
      cfg.tg = me.result.username; saveCfg();
      msg('#mTg','m-ok',`✓ Подключено: заявки будут приходить от @${me.result.username}`);
    }catch(e){ msg('#mTg','m-bad', ['auth','nowrite','nodata','conflict','net'].includes(e.message) ? '✗ '+errText(e) : 'Нет связи. Проверь интернет и нажми ещё раз'); }
  };
  $('#bTok').onclick = async ()=>{
    const t = $('#tok').value.trim();
    if (!t) return msg('#mTok','m-bad','Вставь пропуск');
    msg('#mTok','m-info','Проверяю…');
    try{
      const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`, { headers:{ Authorization:'Bearer '+t }, cache:'no-store' });
      const j = r.ok ? await r.json() : null;
      if (!j || !j.permissions || !j.permissions.push) return msg('#mTok','m-bad','Пропуск не даёт записи в klyuchi. Проверь пункты 3 и 4');
      cfg.token = t; saveCfg(); msg('#mTok','m-ok','✓ Подключено'); loadStats();
      setTimeout(closePop, 900);
    }catch(e){ msg('#mTok','m-bad','Нет связи с GitHub'); }
  };
}
$('#bSet').onclick = openSettings;

/* ---------- no zoom ---------- */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev, e=>e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});

/* ---------- pull to refresh ---------- */
const freshUrl = tag => location.pathname + '?' + tag + '=' + Date.now();
(()=>{
  let y0=null, dy=0; const p=$('#ptr');
  addEventListener('touchstart', e=>{ if (scrollY<=0 && !$('#ov').classList.contains('on')) { y0=e.touches[0].clientY; dy=0; } else y0=null; }, {passive:true});
  addEventListener('touchmove', e=>{ if(y0===null) return; dy=e.touches[0].clientY-y0; if(dy>0){ const k=Math.min(dy,110); p.style.opacity=Math.min(1,k/70); p.style.transform=`translate(-50%,${k-60}px) rotate(${k*3}deg)`; } }, {passive:true});
  addEventListener('touchend', ()=>{ if(y0===null) return; if(dy>80){ p.style.transform='translate(-50%,40px)'; if(/^https?:/.test(location.protocol)) location.replace(freshUrl('r')); else location.reload(); } else { p.style.opacity=0; p.style.transform='translate(-50%,-60px)'; } y0=null; });
})();

/* ---------- self-update after deploy ---------- */
async function checkUpdate(){
  if (!/^https?:/.test(location.protocol)) return;
  try{
    const t = await (await fetch(location.pathname + '?check=' + Date.now(), {cache:'no-store'})).text();
    const m = t.match(/APP_VER = '([^']+)'/);
    if (m && m[1]!==APP_VER) location.replace(freshUrl('v'+m[1]));
  }catch(e){}
}

/* ---------- ждут проверки: заявки, по которым приложение открыто временно (10 часов) ---------- */
const QURL = 'https://ntfy.sh/ugq-af43161359a999ea';
const PRICE = { m:'390 ₽', h:'1 990 ₽', y:'2 990 ₽', f:'1 990 ₽' };
const PLT = { m:'1 месяц', h:'6 месяцев', y:'1 год', f:'навсегда' };
let Q = [];
const QSKIP = ['UG-K7CR-LX3H-9PJX','UG-4CJ2-3LRE-5GNV']; // тестовые заявки — не показывать
async function loadQ(){
  const box = $('#qList');
  try{
    const r = await fetch(QURL+'/json?poll=1&since=12h', {cache:'no-store'});
    const tx = r.ok ? await r.text() : '';
    const by = {};
    tx.split('\n').forEach(l=>{ try{ const e=JSON.parse(l), m=JSON.parse(e.message||'{}'); if(m.k && m.ph && (!by[m.k] || by[m.k].t < m.t)) by[m.k]=m; }catch(x){} });
    const all = Object.values(by).sort((a,b)=>a.t-b.t), out = [];
    for (const m of all){
      if (QSKIP.includes(m.k)) continue;
      const k = parseKey(m.k); if (k.err) continue;
      try{ const S = await shard(k); if (S.d.a[S.id] || S.d.b.includes(S.id)) continue; }catch(e){}
      out.push(m);
    }
    Q = out; $('#qN').textContent = Q.length;
    if (!Q.length){ box.innerHTML = '<div class="mut">Новых заявок нет</div>'; return; }
    box.innerHTML = Q.map((m,i)=>{
      const d = new Date(m.t), hm = d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}), dd = d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});
      return `<div class="qi"><div class="qh"><span>+${m.ph}</span><span class="mut">${dd} ${hm}</span></div>
        <div class="qs">${APPS[m.app]||m.app} · ${PLT[PRICE[m.pl]?m.pl:'h']} · ${PRICE[PRICE[m.pl]?m.pl:'h']} · ${m.k}</div>
        <div class="qb"><button class="btn gold sm" data-qa="${i}" style="grid-column:1/-1">✓ Активировать</button></div></div>`;
    }).join('');
  }catch(e){ box.innerHTML = '<div class="mut">Нет связи — потяни вниз, чтобы обновить</div>'; }
}
$('#qList').onclick = e=>{
  const a = e.target.closest('[data-qa]'), b = e.target.closest('[data-qb]');
  if (a){ const m = Q[+a.dataset.qa]; setTerm(PRICE[m.pl]&&m.pl!=='f'?m.pl:'h'); $('#pAct').value='+'+m.ph; $('#kAct').value=m.k; openAct(); $('#bAct').click(); setTimeout(loadQ, 5000); }
  if (b){ const m = Q[+b.dataset.qb]; $('#kBlk').value=m.k; $('#bBlk').click(); setTimeout(loadQ, 8000); }
};
setInterval(()=>{ if(document.visibilityState==='visible') loadQ(); }, 30000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ checkUpdate(); loadStats(); loadQ(); } });
addEventListener('focus', checkUpdate);
setInterval(()=>{ if(document.visibilityState==='visible') checkUpdate(); }, 60000);

/* ---------- boot ---------- */
ghOk(false); loadStats(); checkUpdate(); loadQ();
